name: Daily Weekly Runner - Clasa a 9-a - 2025-2026

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: 'Sheet ID'
        type: string
        required: true
        default: '1hlZ1XwmkU3X7EHZ_rU_6bHD9-zEGWXi7Jt-goEIlFto'
      homework:
        description: 'Homework'
        type: string
        required: true
        default: 'last'
      taskgroup:
        description: 'Task Group'
        type: string
        required: true
        default: 'all'
      student:
        description: 'Student'
        type: string
        required: true
        default: 'all'
  
  schedule:
    - cron: '00 18 * * 2'

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the C# project
        run: dotnet build --configuration Release

      - name: Run the compiled application with arguments
        run: dotnet run --project NerdvanaCrawler.csproj -- -sheet $sheet -homework $homework -taskgroup $taskgroup -student $student