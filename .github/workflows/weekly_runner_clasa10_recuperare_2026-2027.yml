name: Weekly Homework Eval - Clasa a 10-a - Recuperare - 2026-2027

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: 'Sheet ID (empty = class default)'
        type: string
        required: false
      homework:
        description: 'Homework'
        type: string
        required: true
        default: 'last'
      taskgroup:
        description: 'Task Group'
        type: string
        required: true
        default: 'all'
      student:
        description: 'Student'
        type: string
        required: true
        default: 'all'

  schedule:
    - cron: '00 12 * * 3'

jobs:
  eval:
    uses: ./.github/workflows/homework_eval.yml
    with:
      sheet: ${{ inputs.sheet }}
      homework: ${{ inputs.homework }}
      taskgroup: ${{ inputs.taskgroup }}
      student: ${{ inputs.student }}
    secrets:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SHEET_ID: ${{ secrets.SHEET_ID_CLASA10_RECUPERARE_2026_2027 }}
